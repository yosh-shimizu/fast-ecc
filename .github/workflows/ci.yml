name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24.04 ships OpenCV 4.6 (the sampler's scalar loops), 26.04 ships 4.10
        # (its universal-intrinsics path); both must build and pass
        image: [ "ubuntu:24.04", "ubuntu:26.04" ]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and OpenCV
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake python3 libopencv-dev

      - name: Kernels match their generator
        run: python3 tools/gen_gn_kernels.py --check

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test (equivalence with cv::findTransformECC)
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark
        run: ./build/bench 512 10
